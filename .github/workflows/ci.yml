name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vp is the project-local Vite+ CLI from node_modules; no global install.
      - name: Format and lint
        run: pnpm exec vp check

      - name: Astro diagnostics
        run: pnpm exec vp run check

      - name: Unit tests
        run: pnpm exec vp run test

      - name: Production build
        run: pnpm exec vp run build

      - name: Check build for draft leaks
        run: pnpm exec vp run verify:build

      # Validates wrangler.jsonc against the build output. No Cloudflare credentials.
      - name: Check Cloudflare config
        run: pnpm exec vp run deploy:dry-run
